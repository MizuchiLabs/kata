name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint and test
        run: |
          go mod tidy
          go mod verify
          go fmt ./...
          go vet ./...
          go test -race -count=1 ./...

      - uses: golangci/golangci-lint-action@v9
        with:
          args: --timeout=10m

      - uses: golang/govulncheck-action@v1
        with:
          repo-checkout: false
